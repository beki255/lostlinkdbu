version: '3.8'

services:
  mongodb:
    image: mongo:7
    container_name: lostlink-mongodb
    restart: unless-stopped
    ports:
      - '27017:27017'
    volumes:
      - mongodb_data:/data/db
    environment:
      MONGO_INITDB_DATABASE: lostlink

  redis:
    image: redis:7-alpine
    container_name: lostlink-redis
    restart: unless-stopped
    ports:
      - '6379:6379'

  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: lostlink-server
    restart: unless-stopped
    ports:
      - '5000:5000'
    depends_on:
      - mongodb
      - redis
    environment:
      NODE_ENV: production
      MONGODB_URI: mongodb://mongodb:27017/lostlink
      REDIS_URL: redis://redis:6379
      PORT: 5000
    env_file:
      - ./server/.env

  client:
    build:
      context: ./client
      dockerfile: Dockerfile
    container_name: lostlink-client
    restart: unless-stopped
    ports:
      - '80:80'
    depends_on:
      - server

volumes:
  mongodb_data:
